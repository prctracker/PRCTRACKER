name: Atualização semanal (PNCP e notícias)

# Reserva: a rodada semanal é feita por uma tarefa agendada no Claude, que revisa os dados antes de publicar.
# Este robô só roda quando acionado à mão (aba Actions → Run workflow).
on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizacao-do-site
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tools/package-lock.json
      - name: Varrer PNCP e notícias
        run: python3 -u tools/auto/pncp_semanal.py
      - name: Montar o site
        run: |
          cd tools
          npm ci --omit=optional
          npm run build
      - name: Publicar
        run: |
          git config user.name "Atualização automática"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src docs
          if git diff --cached --quiet; then echo "Nada novo"; exit 0; fi
          git commit -m "Atualização semanal: PNCP e notícias ($(date -u +%Y-%m-%d))"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
